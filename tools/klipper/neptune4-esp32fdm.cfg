# Added for the ESP32 FDM bridge board: the Neptune 4 Max top light on or
# off (Elegoo's FLASHLIGHT_SWITCH only toggles it, so the board could not know
# the state). Elegoo's screen app watches /home/mks/gpio66_value and sets the
# pin: 1 on, 0 off (it answers 3 or 2). The ramp light (gpio79) is left alone.
# For Elegoo's 2024 image (screen app of 06.2024, Klipper with
# gcode_shell_command: fdm14, fdm15). The 2025 image (fdm16, fdm19) takes
# gpio79_value instead: neptune4-2025-esp32fdm.cfg.
#
# Install: copy this file to the config root as esp32fdm.cfg, add
# [include esp32fdm.cfg] to printer.cfg (next to [include plr.cfg]), restart
# Klipper. The board then finds FDM_LIGHT in /printer/objects/list.
[gcode_shell_command esp32fdm_light]
command: sh -c 'echo $0 > /home/mks/gpio66_value'
timeout: 2.
verbose: False

[gcode_macro FDM_LIGHT]
description: Top light on (S=1) or off (S=0)
gcode:
  RUN_SHELL_COMMAND CMD=esp32fdm_light PARAMS={1 if params.S|default(1)|int else 0}
