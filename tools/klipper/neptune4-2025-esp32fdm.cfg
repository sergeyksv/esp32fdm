# Added for the ESP32 FDM bridge board: the Neptune 4 Max top light on or off,
# for Elegoo's 2025 image (screen app znp_tjc_klipper of 09.2025, fdm16 and
# fdm19), which comes with the newer toolhead (MCU THR on a USB-C cable; its
# light is [output_pin caselight1], left alone here). Its screen button and the app's own threads hold host gpio66 and
# gpio79 both at one state, and only /home/mks/gpio79_value changes it: 1 on,
# 0 off (it answers 3 or 2). /home/mks/gpio66_value is answered but ignored.
# The 2024 image (fdm14, fdm15) takes gpio66_value: neptune4-esp32fdm.cfg.
#
# This image's Klipper has no gcode_shell_command: copy gcode_shell_command.py
# (KIAUH's, as on the 2024 image) to ~/klipper/klippy/extras/ first. Then copy
# this file to the config root as esp32fdm.cfg, add [include esp32fdm.cfg] to
# printer.cfg (after [include MCU_ID.cfg]) and restart Klipper.
[gcode_shell_command esp32fdm_light]
command: sh -c 'echo $0 > /home/mks/gpio79_value'
timeout: 2.
verbose: False

[gcode_macro FDM_LIGHT]
description: Top light on (S=1) or off (S=0)
gcode:
  RUN_SHELL_COMMAND CMD=esp32fdm_light PARAMS={1 if params.S|default(1)|int else 0}

# Elegoo's CANCEL_PRINT and PRINT_END run RUN_SHELL_COMMAND CMD=clear_plr, which
# this image does not define. Without gcode_shell_command the line was skipped
# as an unknown command; with it the undefined command stops the macro, so a
# cancel (also from Obico) did nothing and a print's end left the heaters on.
# The 2024 image defines it the same way.
[gcode_shell_command clear_plr]
command: sh /home/mks/clear_plr.sh
timeout: 5.
verbose: False
